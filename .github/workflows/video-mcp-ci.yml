name: Verify video MCP (no deployment)

on:
  push:
    branches:
      - feature/github-oauth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install
      - name: Emit generated public lockfile for synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from base64 import b64encode
          encoded = b64encode(Path('bun.lock').read_bytes()).decode('ascii')
          for i in range(0, len(encoded), 1000):
              print('LOCKFILE_CHUNK=' + encoded[i:i+1000])
          PY
      - name: Check TypeScript
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Check production Worker bundle without deploying
        run: bunx wrangler deploy --config wrangler.chatgpt.jsonc --dry-run --outdir ./wrangler-build
